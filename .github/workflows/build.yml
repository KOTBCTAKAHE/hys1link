name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 secret is not set — APK will be signed with a throwaway debug key"
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Hys1Link-${GITHUB_RUN_NUMBER}.apk"
          ls -la out
          echo "## APK contents" >> "$GITHUB_STEP_SUMMARY"
          unzip -l out/*.apk | grep -E '\.so$|classes.*\.dex' | tee -a "$GITHUB_STEP_SUMMARY"
          unzip -l out/*.apk | grep -q 'lib/arm64-v8a/libsignal_jni.so' || { echo "::error::libsignal_jni.so missing from APK"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Hys1Link-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: Hys1Link build ${{ github.run_number }}
          body: |
            Automatic build from ${{ github.sha }}.
            Install the APK, then link it from Link → Settings → Linked devices.
          files: out/*.apk
          prerelease: true
